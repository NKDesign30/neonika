name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Verify tag and changelog
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          version=$(node -p 'require("./package.json").version')
          test "${GITHUB_REF_NAME}" = "v${version}"
          bash scripts/verify-changelog.sh
      - run: npm run doctor
      - run: npm run ui:test
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          asset_name="gitleaks_${VERSION}_linux_x64.tar.gz"
          asset="$RUNNER_TEMP/$asset_name"
          binary="$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${asset_name}"
          echo "${SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$binary" /usr/local/bin/gitleaks
      - name: Restore publication identity denylist
        env:
          DENYLIST_B64: ${{ secrets.OSS_AUDIT_DENYLIST }}
        run: |
          set -euo pipefail
          test -n "${DENYLIST_B64:-}"
          printf '%s' "$DENYLIST_B64" | base64 -d > scripts/oss-audit-denylist.sha256
      - run: bash scripts/oss-audit.sh --history
      - run: bash scripts/package-release.sh
      - run: bash scripts/npm-install-smoke.sh release/neonika.tgz
      - name: Verify release manifest is clean
        run: |
          node <<'NODE'
          const manifest = require("./release/neonika.release.json");
          if (manifest.dirty || manifest.commit !== process.env.GITHUB_SHA) {
            throw new Error("release manifest is dirty or points at the wrong commit");
          }
          NODE
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/neonika.tgz \
            release/neonika.tgz.sha256 \
            release/neonika.release.json \
            --verify-tag \
            --title "Neonika ${GITHUB_REF_NAME#v}" \
            --notes-file release/neonika.release-notes.md
